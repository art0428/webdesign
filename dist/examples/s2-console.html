<!DOCTYPE html>
<html lang="zh-Hant" data-style="s2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S2 浮雕 · 出貨站控制面板 — 管理者工作室 設計系統 26.0.0</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../style-s2.css">
<style>
/* 本頁只做排版，一律用 token；元件外觀全部來自 dist/ */
.ic{flex:none;vertical-align:middle}
.topnav{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;font-size:var(--fs-b2);line-height:var(--lh-b2)}
.topnav .brand{font-weight:900;font-size:var(--fs-h3);line-height:var(--lh-h3);letter-spacing:var(--ls-h3);display:flex;align-items:center;gap:var(--sp-2)}
.topnav .brand i{width:14px;aspect-ratio:1/1;border-radius:4px;background:var(--acc2);display:inline-block}
.topnav .links{display:flex;gap:var(--sp-5);font-weight:500}
.topnav .links a{color:var(--ink);text-decoration:none}
.topnav .sp{margin-left:auto;display:flex;gap:var(--sp-2);align-items:center}
.row{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.foot-note{font-size:var(--fs-b3);line-height:var(--lh-b3);color:var(--muted)}
.foot-note a{color:var(--acc)}
/* 下面兩條是版面層的保護，不改元件外觀：窄欄裡按鈕文字不得折行；表格標題列在手機上允許換行 */
.t .btn.sm,.t .dt{white-space:nowrap}
@media (max-width:767px){.tcap{flex-wrap:wrap}.tcap .sp{flex-wrap:wrap;margin-left:0;width:100%}}

.wrap{max-width:860px;margin:0 auto;padding:var(--sp-6) var(--sp-5) var(--sp-9);display:grid;gap:var(--sp-6)}
.ph h1{font-size:var(--fs-h1);line-height:var(--lh-h1);letter-spacing:var(--ls-h1);font-weight:900;margin:0}
.ph .sub{font-size:var(--fs-b3);line-height:var(--lh-b3);color:var(--muted)}
.panel{display:grid;gap:var(--sp-5)}
.ctl{display:grid;grid-template-columns:1fr auto;gap:var(--sp-3) var(--sp-5);align-items:center}
.ctl .lb b{display:block;font-size:var(--fs-b1);line-height:var(--lh-b1);font-weight:700}
.ctl .lb span{font-size:var(--fs-b3);line-height:var(--lh-b3);color:var(--muted)}
.panel .bar{width:100%}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--sp-4);align-items:start}
.big .btn{width:100%}
.sec-h{font-size:var(--fs-h3);line-height:var(--lh-h3);letter-spacing:var(--ls-h3);font-weight:900;margin:0 0 var(--sp-3)}

/* 規範 6.2（v22）：容器左右內距＝欄格外邊距，寬以上 24、平板 20、手機 16；放在頁面排版之後，各頁一致 */
.main,.wrap{padding-left:var(--sp-6);padding-right:var(--sp-6)}
/* 規範 v26 5.7：寬鬆密度（S1〜S5、S7 的預設）的頁面層——區段之間 --sp-7、頁首上方 --sp-8、側欄群組之間 --sp-6；S6 預設標準，不套 */
:where(html[data-density="comfortable"],html[data-style="s1"]:not([data-density]),html[data-style="s2"]:not([data-density]),html[data-style="s3"]:not([data-density]),html[data-style="s4"]:not([data-density]),html[data-style="s5"]:not([data-density]),html[data-style="s7"]:not([data-density])) .main,
:where(html[data-density="comfortable"],html[data-style="s1"]:not([data-density]),html[data-style="s2"]:not([data-density]),html[data-style="s3"]:not([data-density]),html[data-style="s4"]:not([data-density]),html[data-style="s5"]:not([data-density]),html[data-style="s7"]:not([data-density])) .wrap{gap:var(--sp-7);padding-top:var(--sp-8)}
:where(html[data-density="comfortable"],html[data-style="s1"]:not([data-density])) .side .grp{padding-top:var(--sp-6)}
:where(html[data-density="comfortable"],html[data-style="s1"]:not([data-density])) .side .grp:first-child{padding-top:var(--sp-2)}
@media (max-width:1023px){.main,.wrap{padding-left:var(--sp-5);padding-right:var(--sp-5)}}
@media (max-width:767px){.main,.wrap{padding-left:var(--sp-4);padding-right:var(--sp-4)}}
</style>
</head>
<body data-type="productive">

<div class="wrap">
  <div class="topnav"><span class="brand"><i></i>管理者工作室 · 出貨站 B</span><span class="sp"><span class="st ok">● 連線中</span><span class="avatar sm">王</span></span></div>
  <div class="ph"><h1>出貨站控制面板</h1><div class="sub">少資料、多操作：每個控制項都夠大，可以戴手套按。</div></div>
  <div class="board panel">
    <div class="sec-h">目前作業</div>
    <div class="row"><span class="seg"><button class="on">揀貨</button><button>包裝</button><button>出貨</button></span>
      <span class="pillf on">區域 B-1</span><span class="pillf">B-2</span><span class="pillf">B-3</span></div>
    <div class="ctl">
      <div class="lb"><b>列印標籤</b><span>每箱一張，含客戶名與單號</span></div><span class="sw2 on"><span class="tk"></span>開</span>
      <div class="lb"><b>重量複核</b><span>超過 ±3% 時提示</span></div><span class="sw2 on"><span class="tk"></span>開</span>
      <div class="lb"><b>通知客戶</b><span>出貨完成後寄 Email</span></div><span class="sw2"><span class="tk"></span>關</span>
      <div class="lb"><b>本批箱數</b><span>最少 1，最多 48</span></div><span class="qty"><button aria-label="減少">－</button><input class="num" value="12"><button aria-label="增加">＋</button></span>
    </div>
  </div>
  <div class="board panel">
    <div class="sec-h">掃描</div>
    <div class="field"><label for="scan">掃描或輸入出貨單號</label><input id="scan" class="num" placeholder="SO-2610xx-xxx" autofocus></div>
    <div class="bar"><i style="width:62%"></i></div>
    <div class="foot-note">今日進度 62%：已出 31 ／ 50 箱，預計 15:40 完成</div>
    <div class="big">
      <button class="btn primary"><svg class="ic" aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>完成出貨</button>
      <button class="btn">暫停此單</button>
      <button class="btn">列印補單</button>
      <button class="btn danger">取消本批</button>
    </div>
  </div>
  <div class="alert info"><i>i</i><div><p>16:00 起第二線停機保養，請在 15:45 前完成最後一批。</p></div></div>
  <p class="foot-note">範例：S2 浮雕 × 少資料多操作的工具（出貨站控制面板） · 規範 8.7 的首選情境。只引用 dist/，頁面自己的 CSS 只做排版。<a href="index.html">回範例索引</a></p>
</div>

<script src="../theme.js"></script>
</body>
</html>
